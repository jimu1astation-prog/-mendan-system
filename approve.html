<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料金試算 申請確認・承認</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f0; color: #222; font-size: 15px; }
.container { max-width: 560px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
h1 { font-size: 19px; font-weight: 600; margin-bottom: 0.3rem; color: #111; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
.card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.row:last-child { border-bottom: none; }
.row .lbl { color: #888; }
.row .val { font-weight: 600; color: #222; text-align: right; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 12px; }
.badge-pending { background: #fff3da; color: #8a6000; }
.badge-approved { background: #e3f7e9; color: #1a7a3a; }
.btn { font-size: 14px; padding: 12px 20px; border-radius: 8px; border: 1px solid #4a6cf7; background: #4a6cf7; color: #fff; cursor: pointer; font-weight: 600; width: 100%; margin-top: 0.5rem; }
.btn:hover { background: #3a5ce7; }
.btn:disabled { background: #aaa; border-color: #aaa; cursor: not-allowed; }
.msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 1rem; }
.msg-ok { background: #f0faf4; color: #1a7a3a; border: 1px solid #b8e6c8; }
.msg-err { background: #fff0f0; color: #b00; border: 1px solid #f5c5c5; }
.msg-info { background: #f0f4ff; color: #334; border: 1px solid #c7d3f5; }
.loading { color: #999; font-size: 14px; text-align: center; padding: 2rem 0; }
.footer-note { font-size: 11px; color: #bbb; margin-top: 2rem; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>料金試算 申請確認・承認</h1>
  <p class="subtitle">登録支援機関 料金試算表｜社内利用限定</p>

  <div id="loadingBox" class="card">
    <div class="loading">読み込み中...</div>
  </div>

  <div id="contentBox" style="display:none">
    <div class="card">
      <div class="row"><span class="lbl">申請ID</span><span class="val" id="v_id">-</span></div>
      <div class="row"><span class="lbl">ステータス</span><span class="val" id="v_status">-</span></div>
      <div class="row"><span class="lbl">担当者</span><span class="val" id="v_staff">-</span></div>
      <div class="row"><span class="lbl">法人名</span><span class="val" id="v_client">-</span></div>
      <div class="row"><span class="lbl">人数</span><span class="val" id="v_workers">-</span></div>
      <div class="row"><span class="lbl">契約年数</span><span class="val" id="v_years">-</span></div>
      <div class="row"><span class="lbl">総売上</span><span class="val" id="v_revenue">-</span></div>
      <div class="row"><span class="lbl">総経費</span><span class="val" id="v_cost">-</span></div>
      <div class="row"><span class="lbl">最終粗利</span><span class="val" id="v_profit">-</span></div>
      <div class="row"><span class="lbl">粗利率</span><span class="val" id="v_margin">-</span></div>
      <div class="row"><span class="lbl">申請日時</span><span class="val" id="v_submittedAt">-</span></div>
      <div class="row" id="row_approvedAt" style="display:none"><span class="lbl">承認日時</span><span class="val" id="v_approvedAt">-</span></div>
    </div>

    <div class="card">
      <button class="btn" id="approveBtn" onclick="approve()">承認する</button>
      <div id="msgBox"></div>
    </div>
  </div>

  <div id="errorBox" class="card" style="display:none">
    <div class="msg msg-err" id="errorMsg">エラーが発生しました。</div>
  </div>

  <p class="footer-note">社内利用限定・無断共有禁止</p>
</div>

<script>
function fmt(n) {
  const v = Number(n);
  if (isNaN(v)) return n;
  return Math.round(v).toLocaleString('ja-JP') + '円';
}
function pct(n) {
  const v = Number(n);
  if (isNaN(v)) return n;
  return (Math.round(v * 10) / 10) + '%';
}
function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return dt.toLocaleString('ja-JP');
}

function getApplicationId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

let currentData = null;

async function loadApplication() {
  const id = getApplicationId();
  if (!id) {
    showError('URLに申請IDが指定されていません。');
    return;
  }
  try {
    const res = await fetch('/api/gas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'simulator_get', id: id })
    });
    const data = await res.json();
    if (!data.success) {
      showError(data.message || '申請が見つかりません。');
      return;
    }
    currentData = data;
    renderApplication(data);
  } catch (e) {
    showError('通信エラー：' + e.message);
  }
}

function showError(message) {
  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('contentBox').style.display = 'none';
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'block';
  document.getElementById('errorMsg').textContent = message;
}

function renderApplication(data) {
  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('contentBox').style.display = 'block';

  document.getElementById('v_id').textContent = data.id || '-';
  document.getElementById('v_staff').textContent = data.staffName || '-';
  document.getElementById('v_client').textContent = data.clientName || '-';
  document.getElementById('v_workers').textContent = (data.workers || '-') + '名';
  document.getElementById('v_years').textContent = (data.years || '-') + '年';
  document.getElementById('v_revenue').textContent = fmt(data.revenue);
  document.getElementById('v_cost').textContent = fmt(data.cost);
  document.getElementById('v_profit').textContent = fmt(data.profit);
  document.getElementById('v_margin').textContent = pct(data.margin);
  document.getElementById('v_submittedAt').textContent = fmtDate(data.submittedAt);

  const statusEl = document.getElementById('v_status');
  const approveBtn = document.getElementById('approveBtn');

  if (data.status === '承認済み') {
    statusEl.innerHTML = '<span class="badge badge-approved">承認済み</span>';
    document.getElementById('row_approvedAt').style.display = 'flex';
    document.getElementById('v_approvedAt').textContent = fmtDate(data.approvedAt);
    approveBtn.style.display = 'none';
    const msgBox = document.getElementById('msgBox');
    msgBox.innerHTML = '<div class="msg msg-info">この申請はすでに承認済みです。</div>';
  } else {
    statusEl.innerHTML = '<span class="badge badge-pending">申請中</span>';
  }
}

async function approve() {
  const id = getApplicationId();
  if (!id) return;
  const btn = document.getElementById('approveBtn');
  const msgBox = document.getElementById('msgBox');
  btn.disabled = true;
  btn.textContent = '処理中...';

  try {
    const res = await fetch('/api/gas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'simulator_approve', id: id })
    });
    const data = await res.json();
    if (data.success) {
      msgBox.innerHTML = '<div class="msg msg-ok">承認しました。</div>';
      document.getElementById('v_status').innerHTML = '<span class="badge badge-approved">承認済み</span>';
      btn.style.display = 'none';
    } else {
      msgBox.innerHTML = '<div class="msg msg-err">' + (data.message || '承認に失敗しました。') + '</div>';
      btn.disabled = false;
      btn.textContent = '承認する';
    }
  } catch (e) {
    msgBox.innerHTML = '<div class="msg msg-err">通信エラー：' + e.message + '</div>';
    btn.disabled = false;
    btn.textContent = '承認する';
  }
}

loadApplication();
</script>
</body>
</html>
